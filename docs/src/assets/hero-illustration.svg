<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="300" cy="200" r="180" fill="url(#bgGlow)" filter="blur(40px)"/>

  <!-- Terminal Window -->
  <rect x="75" y="60" width="450" height="280" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="75" y="60" width="450" height="40" rx="16" fill="#1e293b"/>
  <rect x="75" y="90" width="450" height="10" fill="#1e293b"/>

  <!-- Window Dots -->
  <circle cx="105" cy="80" r="6" fill="#ef4444"/>
  <circle cx="125" cy="80" r="6" fill="#f59e0b"/>
  <circle cx="145" cy="80" r="6" fill="#10b981"/>

  <!-- Title -->
  <text x="300" y="85" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="13" font-weight="600">create-stack wizard</text>

  <!-- Code / CLI Prompt lines -->
  <text x="105" y="130" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">$</text>
  <text x="125" y="130" fill="#f8fafc" font-family="monospace" font-size="14">npx @exa31/create-stack</text>

  <text x="105" y="165" fill="#10b981" font-family="monospace" font-size="13">✔</text>
  <text x="125" y="165" fill="#94a3b8" font-family="monospace" font-size="13">Project Name:</text>
  <text x="235" y="165" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="bold">my-saas-platform</text>

  <text x="105" y="195" fill="#10b981" font-family="monospace" font-size="13">✔</text>
  <text x="125" y="195" fill="#94a3b8" font-family="monospace" font-size="13">Mode:</text>
  <text x="180" y="195" fill="#c084fc" font-family="monospace" font-size="13">Fullstack (FE + BE + Worker)</text>

  <text x="105" y="225" fill="#10b981" font-family="monospace" font-size="13">✔</text>
  <text x="125" y="225" fill="#94a3b8" font-family="monospace" font-size="13">Services:</text>
  <text x="200" y="225" fill="#38bdf8" font-family="monospace" font-size="13">React 19 + Go Fiber + Go Worker</text>

  <text x="105" y="255" fill="#10b981" font-family="monospace" font-size="13">✔</text>
  <text x="125" y="255" fill="#94a3b8" font-family="monospace" font-size="13">Database:</text>
  <text x="205" y="255" fill="#818cf8" font-family="monospace" font-size="13">MySQL 8.4 (Port 3306)</text>

  <text x="105" y="285" fill="#10b981" font-family="monospace" font-size="13">✔</text>
  <text x="125" y="285" fill="#94a3b8" font-family="monospace" font-size="13">Broker:</text>
  <text x="190" y="285" fill="#f59e0b" font-family="monospace" font-size="13">Both (RabbitMQ + Apache Kafka)</text>

  <text x="105" y="318" fill="#a855f7" font-family="monospace" font-size="13">✨ Scaffolded in 420ms with merged .agents/skills!</text>
</svg>
