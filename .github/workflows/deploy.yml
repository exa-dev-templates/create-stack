name: Deploy Documentation to Kubernetes

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  deploy:
    uses: exa31/github-workflows/.github/workflows/frontend.yml@v1.0.0
    with:
      app_name: create-stack-docs
      namespace: create-stack
      image_name: ghcr.io/exa-dev-templates/create-stack-docs
      docker_context: ./docs
      dockerfile: ./docs/Dockerfile
      node_version: "22"
      ssh_port: 31080
      kubeconfig: /home/deploy/.kube/config
      rollout_timeout: 300s
      push_latest: true
      tag_prefix: "docs-"
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
